[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"


[[redirects]]
  from = "/projets/event-flow/*"
  to = "/projets/"
  status = 301

[[redirects]]
  from = "/projets/roue-fortune/*"
  to = "/projets/"
  status = 301

[[redirects]]
  from = "/projets/build-gaming/*"
  to = "/projets/"
  status = 301

[[redirects]]
  from = "/projets/devis-more/*"
  to = "/projets/"
  status = 301

[[redirects]]
  from = "/projets/migration-pc/*"
  to = "/projets/"
  status = 301
